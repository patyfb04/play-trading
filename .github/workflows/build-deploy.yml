name: Build and Deploy Play.Trading.NET Service Container to Azure Kubernetes Service

on:
  push:
    branches:
      - master

env:
  ACR_NAME: playeconomyapp
  IMAGE_NAME: play-trading
  CONTAINER_APP_NAME: play-trading
  RESOURCE_GROUP: play-rg
  AZURE_REGION: eastus
  AKS_CLUSTER: playrg-kube-cluster-ca
  K8S_MANIFEST_PATH: k8s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image to ACR
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)

          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:v3 \
            --image $IMAGE_NAME:$IMAGE_TAG \
            --build-arg GITHUB_TOKEN=${{ secrets.PAT_GITHUB_TOKEN }} \
            .

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      # -------------------------------
      # Cosmos DB Secret (heredoc)
      # -------------------------------
      - name: Apply Cosmos DB Secret
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: cosmosdb-connection
            namespace: default
          type: Opaque
          stringData:
            CosmosDbSettings__ConnectionString: "${{ secrets.COSMOS_CONNECTION_STRING }}"
          EOF

      # -------------------------------
      # SQL Saga DB Secret (heredoc)
      # -------------------------------
      - name: Apply SQL Saga DB Secret
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: saga-db-connection
            namespace: default
          type: Opaque
          stringData:
            SqlDbSettings__ConnectionString: "${{ secrets.AZURE_SQL_SAGADB_CONNECTION_STRING }}"
          EOF

      - name: Update image tag in Kubernetes manifests
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          sed -i "s|IMAGE_TAG_PLACEHOLDER|$IMAGE_TAG|g" $K8S_MANIFEST_PATH/deployment.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f $K8S_MANIFEST_PATH
