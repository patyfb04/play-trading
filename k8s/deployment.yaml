apiVersion: apps/v1
kind: Deployment
metadata:
  name: play-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: play-trading
  template:
    metadata:
      labels:
        app: play-trading
    spec:
      serviceAccountName: play-trading-sa
      containers:
        - name: play-trading
          image: playeconomyapp.azurecr.io/play-trading:IMAGE_TAG_PLACEHOLDER

          command: []
          args: []

          ports:
            - containerPort: 5000

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:5000"

            # Cosmos DB connection string
            - name: CosmosDbSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: cosmosdb-connection
                  key: CosmosDbSettings__ConnectionString

            - name: CosmosDbSettings__DatabaseName
              value: "Catalog"

            # SQL Saga DB connection string (NEW)
            - name: SqlDbSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: saga-db-connection
                  key: SqlDbSettings__ConnectionString

            # Optional: database name (safe to hardcode)
            - name: SqlDbSettings__DatabaseName
              value: "play-sagas"

            # Service Bus namespace
            - name: ServiceBusSettings__FullyQualifiedNamespace
              value: "sb://playeconomy-servicebus.servicebus.windows.net"

            - name: MassTransitSettings__Retries
              value: "3"

            - name: MassTransitSettings__TimeIntervalInSeconds
              value: "5"

            - name: ServiceSettings__Authority
              value: "https://play-identity"

            - name: AllowedOrigin
              value: "http://play-frontend"

            - name: ServiceSettings__ServiceName
              value: "play-trading"
